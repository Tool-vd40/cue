name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: swift build -c release
      - run: .build/release/Cue --selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/Cue.zip dist/Cue.dmg --generate-notes \
            --notes "Download **Cue.dmg** below. macOS warns on first launch that it can't verify the app: [how to open it](https://github.com/Tool-vd40/cue#install) · [как открыть](https://github.com/Tool-vd40/cue/blob/main/README.ru.md#установка)"
        env:
          GH_TOKEN: ${{ github.token }}
